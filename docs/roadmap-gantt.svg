<text x="40" y="810" font-size="16">◇ 環境昇格PRの後。開発者の文書構成の相談結果を待つ。開始日・期間は未確定。</text>
<rect x="24" y="870" width="1190" height="94" fill="white" stroke="#cbd5e1" rx="5"/>
<text x="40" y="900" font-size="17" font-weight="bold">任意・未採用 O-F2-WRITE：承認付き供給状態変更</text>
<text x="40" y="932" font-size="15">◇ 採否・時期・工数・PR数は未確定。確定の残PR数には加えない。</text>
<text x="24" y="1016" font-size="15">正式デモは5173/API8002。製品変更なし。旧データは退避・旧volume保持。mergeは開発者。</text>
