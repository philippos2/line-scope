<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc">
<title id="title">F2電源依存とF3範囲一覧のガントチャート</title>
<desc id="desc">#277はmerge済み。F2は読取専用のB案採用、互換修正と自動回帰は成功、実装headのCIは成功、実API9要求・通常画面は確認済み、開発者確認待ち。横軸はF2実装承認後の相対作業日0から3.5、2〜3.5日の計画上限を表示する。青は設計実装、水色は自動試験、紫は直接APIとブラウザ、緑はCIと記録。色は進捗ではない。F3はF2 merge後で日付と工数未確定。承認付き更新は任意・未採用で期間未確定。</desc>
<rect width="1240" height="800" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#183247">
