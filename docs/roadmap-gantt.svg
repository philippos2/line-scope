<text x="26" y="74" font-size="18">残りBの1 PR。本体5〜7.5作業日＋分割手間0.25〜0.5日程度。レビュー・CI等の待ち時間は別。A1：#267 merge済み。A2：#268 merge済み。B：実装・検証済み、利用者確認待ち。</text>

