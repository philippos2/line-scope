<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc">
<title id="title">F2電源依存とF3範囲一覧のガントチャート</title>
<desc id="desc">#277はmerge済み。F2は調査完了、実装未承認。横軸はF2実装承認後の相対作業日0から7、5〜7日の案の上限を表示する。青は設計実装、水色は自動試験、紫は直接APIとブラウザ、緑はCIと記録。色は進捗ではない。F3はF2 merge後で日付と工数未確定。</desc>
<rect width="1240" height="680" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#183247">
