<rect x="464" y="482" width="987" height="36" rx="5" fill="white" stroke="#64748b" stroke-dasharray="6 4"/><text x="957.5" y="506" text-anchor="middle" font-size="14">(b)はA1→A2→B、(c)はA1→B→後続A2。状態共通化はA1だけへ計上</text>
<text x="26" y="553" font-size="18">API不足等の条件付き追加C</text><text x="26" y="574" font-size="13">必要性・工数とも未確定</text>
<rect x="464" y="539" width="987" height="36" rx="5" fill="white" stroke="#64748b" stroke-dasharray="6 4"/><text x="957.5" y="563" text-anchor="middle" font-size="14">ドロワーの分割とは別。判明時に報告・判断</text>
<text x="26" y="658" font-size="16">横軸：(a)一体化案の最大作業日枠。A単独は2.5〜3.5日、ドロワー追加は0.5〜1日。待ち時間は別。</text>
<text x="26" y="693" font-size="16">ドロワー採否とA全体の工数を開発依頼者が判断する。追加分だけを見て旧2〜3日に収まるとは説明しない。</text>
<text x="26" y="728" font-size="16">各PRに必要な検証・実画面・CI・文書を含む。図・根拠の参照は取得済み情報を使い、新APIを増やさない。</text>
<text x="26" y="763" font-size="16">分割内訳：docs/design/post265-ui-correction-plan.md §11.10。実装命令まで変更しない。5173番は変更しない。</text>
