</g>
<rect x="24" y="532" width="1190" height="190" fill="white" stroke="#cbd5e1" rx="5"/>
<text x="40" y="560" font-size="17" font-weight="bold">追加PR：正式デモ環境への昇格（切替・検証済み、PR確認待ち）</text>
<g font-size="15"><text x="330" y="592">10/26</text><text x="610" y="592">10/27</text><text x="890" y="592">10/28</text><text x="1150" y="592">10/29</text></g>
