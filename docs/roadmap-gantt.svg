<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="620" viewBox="0 0 1540 620" role="img" aria-labelledby="title desc">
<title id="title">PR #270後の操作状態是正：監査文書、書込、比較・質問、読取・接続</title>
<desc id="desc">A1、A2、Bと完了後導線はmerge済み。残る工程は文書271はmerge済み、残り修正2から3 PR。文書最大1日、書込最大1.5日、比較質問最大1日、読取接続最大1日。相対合計最大4.5作業日。各工程でレビューとmergeを挟み、待ち時間は含まない。実書込確認は事前許可が必要で別枠。</desc>
<rect width="1540" height="620" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#183247">
<text x="28" y="40" font-size="25">残工程：状態規約と監査 → 書込の安全な復帰 → 比較・質問 → 読取・接続</text>
<text x="28" y="74" font-size="17">#267〜#271 merge済み。残り修正2〜3 PR（現在のW1/W2を含む）。相対工数の最大枠／待ち時間は別。</text>
