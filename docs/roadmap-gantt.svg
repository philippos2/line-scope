<text x="24" y="476" font-size="15" fill="#357354">完了：経済・能力・安全・計画／履歴の登録と統合比較、上流インフラの統合（#252）。</text>
<text x="24" y="510" font-size="15">順序：総合受入 → 判明した安全／計画・履歴の不足解消 → 完成版の運用・復旧受入。</text>
<text x="24" y="542" font-size="15">破線は追加修正が必要な場合だけ使う枠。新機能や独立PRを無条件に増やす計画ではない。</text>
<text x="24" y="574" font-size="15">各PRは画面・Agent・業務経路検証までまとめる。未検証を完了扱いしない。</text>
