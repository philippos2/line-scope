<text x="43" y="534" font-size="17">別枠・未検証：専用環境の実Prepare → 別担当者承認 → 元依頼者実行 → 調査再取得</text>
<text x="43" y="559" font-size="16">事前に環境・認証主体・操作を提示し、明示許可後に実施。確認だけなら追加PR不要。日数へ未計上。</text>
<text x="28" y="606" font-size="14">案B/C・実行後の再取得リンク・シナリオ2・データ拡充・新APIは判断待ちで、この枠に含めない。</text>
