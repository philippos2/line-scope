<text x="24" y="145" font-size="17" font-weight="bold">安全条件・リスク</text>
<text x="24" y="169" font-size="13">登録・判定は完了。残る統合受入の不足対応</text>
<text x="390" y="145" font-size="14" fill="#c99640">統合待ち</text>
<rect x="754" y="125" width="82" height="37" rx="4" fill="#c99640"/>
<text x="795" y="149" text-anchor="middle" font-size="14" fill="white" font-weight="bold">0〜1 PR</text>
<text x="24" y="213" font-size="17" font-weight="bold">対応計画・故障履歴</text>
<text x="24" y="237" font-size="13">修理／交換案・作業／調達時間・故障事実</text>
<text x="390" y="213" font-size="14" fill="#c99640">検証中</text>
