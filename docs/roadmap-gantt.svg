<rect x="40" y="834" width="6" height="38" fill="#0f766e"/><text x="60" y="858" font-size="16">1　完成候補の最終レビュー：全編聴感は未確認。開発者の確認待ち</text>
<text x="60" y="892" font-size="15">　 技術的な音声検査を聴感の代わりにしない。必要な修正は同じPR #286で対応</text>
<rect x="40" y="913" width="6" height="38" fill="#0f766e"/><text x="60" y="937" font-size="16">2　◇ 最終承認 → 開発者によるmerge・動画公開・README設定</text>
<text x="40" y="976" font-size="15">無料運用。制作は本体とは別のローカルディレクトリ。動画用リモートrepo・アップロードなし。</text>
<rect x="24" y="1024" width="1230" height="86" rx="5" fill="white" stroke="#cbd5e1"/>
<text x="40" y="1055" font-size="16" font-weight="bold">任意・未採用 O-F2-WRITE：承認付き供給状態変更</text>
<text x="40" y="1086" font-size="15">◇ 採否・時期・工数未定。動画の残タスクや確定した製品追加予定には含めない。</text>
<text x="24" y="1149" font-size="15">製品コード・DB・seed・認証・稼働環境は変更しない。第1弾の動画とREADMEは今回変更なし。</text>
<text x="24" y="1176" font-size="14">第2弾7分14秒は動画の実測尺であり、制作工数ではない。公開・mergeは開発者が判断する。</text>
</g></svg>
