<text x="35" y="992" font-size="18" font-weight="bold">H5：質問と参照能力の照合（#276内、旧候補は退行で撤去／口語対応はH6で再設計）</text>
<text x="440" y="1018" font-size="16">旧版と候補の比較は履歴で分離。偽の受理・確認頻度の評価をH6へ追加し、完了扱いしない。</text>
<text x="30" y="1040" font-size="17">矢印は前工程の終了後に着手する依存。半日の境界も棒幅へ反映。実績・確定納期ではない。</text>
<text x="35" y="1068" font-size="17" font-weight="bold">H5回帰：全12組→ペアワイズ6組。H6の具体設計・実装承認前にコードへ進まない。</text>
<text x="30" y="1104" font-size="22" font-weight="bold">追加H6：曖昧な解釈の確認（同じ#276・実装中／検証未完）</text>
<text x="30" y="1129" font-size="16">U0＝本設計の実装承認。追加3〜5作業日の上限配分。旧T0計画とは別。待ち時間・実績ではない。</text>
