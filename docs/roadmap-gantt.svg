<title id="title">画面修正の比較用ガント：(a)一体化案、分割採否待ち</title>
<desc id="desc">実装Aはドロワーなし2.5〜3.5日、あり3〜4.5日。Bは2〜3日。図は採用案の最大7.5作業日枠であり、実装未着手。開発依頼者の採否判断と開始命令を待つ。</desc>
