</g>
<text x="24" y="401" font-size="17" font-weight="bold">V1制作の概算：V2企画レビュー後の制作開始からの相対作業日（暫定）</text>
<text x="24" y="429" font-size="15">◇ 現在のゲート：V2の企画案レビュー → V1制作開始。第1弾の絵コンテは変更しない。</text>
