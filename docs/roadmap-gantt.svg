<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
<title id="title">LineScope 残り1 PR：F3ドキュメント最終整理</title>
<desc id="desc">暦日2026年10月26日から28日の時間軸。F2と正式環境昇格は完了。F3は27日に承認を受け文書整理に着手。CI、最終レビュー、mergeの完了日は未定。色は工程種別であり進捗ではない。</desc>
