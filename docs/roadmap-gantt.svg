<rect x="934" y="397" width="172" height="37" rx="4" fill="#8295a5"/>
<text x="1020" y="421" text-anchor="middle" font-size="14" fill="white" font-weight="bold">1〜2 PR</text>
<text x="24" y="518" font-size="15">安全B04/B07確定済み。次の着手条件： 計画・履歴B05/B06/B07。インフラはB08確定後の必要分。</text>
<text x="24" y="545" font-size="15">総合受入：正式入力のDecision Package・全BS/Golden・一般LLM/検索・対象UI経路。</text>
<text x="24" y="572" font-size="15">各PRは画面・Agent・業務経路検証までまとめる。必要な機能・検証を削ってPR数を合わせない。</text>
