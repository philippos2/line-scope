<text x="595" y="149" text-anchor="middle" font-size="14" fill="white" font-weight="bold">1〜2 PR</text>
<text x="24" y="225" font-size="17" font-weight="bold">安全条件・リスクの不足対応</text>
<text x="24" y="249" font-size="13">総合受入で不足が出た場合に対応</text>
<text x="388" y="225" font-size="14" fill="#c99640">条件付き</text>
<rect x="714" y="205" width="107" height="37" rx="4" fill="#c99640" fill-opacity="0.75" stroke="#9f722b" stroke-dasharray="5 4"/>
<text x="767.5" y="229" text-anchor="middle" font-size="14" fill="white" font-weight="bold">0〜1 PR</text>
<text x="24" y="305" font-size="17" font-weight="bold">対応計画・故障履歴の不足対応</text>
<text x="24" y="329" font-size="13">総合受入で不足が出た場合に対応</text>
<text x="388" y="305" font-size="14" fill="#c99640">条件付き</text>
<rect x="829" y="285" width="107" height="37" rx="4" fill="#c99640" fill-opacity="0.75" stroke="#9f722b" stroke-dasharray="5 4"/>
<text x="882.5" y="309" text-anchor="middle" font-size="14" fill="white" font-weight="bold">0〜1 PR</text>
<text x="24" y="385" font-size="17" font-weight="bold">運用・復旧受入</text>
<text x="24" y="409" font-size="13">完成schemaで復元・再構築・障害復旧</text>
<text x="388" y="385" font-size="14" fill="#8295a5">未完了</text>
<rect x="944" y="365" width="222" height="37" rx="4" fill="#8295a5"/>
