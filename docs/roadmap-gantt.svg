<text x="40" y="692" font-size="15">暦日2026-10-26の実施日バー。終日工数ではない。5174/5178停止、正式5173へ統一。</text>
<rect x="24" y="746" width="1190" height="100" fill="white" stroke="#cbd5e1" rx="5"/>
