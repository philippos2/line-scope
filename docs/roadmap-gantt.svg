<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" role="img" aria-labelledby="title desc">
<title id="title">F2完了、正式デモ昇格とF3のガントチャート</title>
<desc id="desc">#277と#278はmerge済み。残りは追加指示の正式デモ環境昇格PRとF3の2 PR。上段は完了F2の旧相対作業日計画枠を保存し、下段の独立した暦日軸に正式昇格の実施日2026-10-26を表示する。日付バーは終日工数を意味しない。青は設計実装、水色は自動試験、紫は直接APIとブラウザ、緑はCIと記録で、進捗を色だけで示さない。F3は開発者の文書構成相談待ち、期間未定。任意の承認付き供給状態変更は未採用。</desc>
<rect width="1240" height="1060" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#183247">
<text x="24" y="36" font-size="24" font-weight="bold">残り2 PR：追加の正式デモ昇格 → F3 やること／やらないこと</text>
<text x="24" y="65" font-size="16">完了：#277・#278 merge。現在：正式5173へ切替・永続化・再起動確認済み、環境昇格PRの確認待ち。</text>
<text x="24" y="94" font-size="15">上段：完了F2の旧計画枠（実績ではない）。下段：追加工程の実施日。色は工程種別。</text>
<rect x="24" y="115" width="1190" height="83" fill="white" stroke="#cbd5e1" rx="5"/>
<text x="40" y="140" font-size="16" font-weight="bold">凡例：バーの色＝工程の種類（進捗・成否・優先度ではない）</text>
<g font-size="15">
<rect x="40" y="158" width="22" height="18" fill="#2563eb"/><text x="72" y="173">青：設計・実装</text>
<rect x="300" y="158" width="22" height="18" fill="#0891b2"/><text x="332" y="173">水色：自動試験・回帰</text>
<rect x="600" y="158" width="22" height="18" fill="#7c3aed"/><text x="632" y="173">紫：直接API・ブラウザ</text>
<rect x="920" y="158" width="22" height="18" fill="#0f766e"/><text x="952" y="173">緑：CI・記録・引渡し</text>
</g>
