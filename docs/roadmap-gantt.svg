<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1070" viewBox="0 0 1280 1070" role="img" aria-labelledby="title desc">
<title id="title">LineScope アプリ・文書完了、動画第1弾から第2弾へ</title>
<desc id="desc">アプリとF3と第1弾の絵コンテは完了。第2弾の概略企画をレビューしてから第1弾の制作へ進む。第1弾制作開始を0とする相対作業日0から3.5の暫定枠。第2弾の詳細制作は第1弾確認後の別指示が条件で期間未定。破線バーは未着手の見積もりで、制作開始・納期確約ではない。</desc>
<rect width="1280" height="1070" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#183247">
<text x="24" y="38" font-size="24" font-weight="bold">アプリ・F3は完了。追加予定：説明動画 第1弾 → 第2弾</text>
<text x="24" y="69" font-size="16">現在：V2の概略企画案をレビュー待ち。V1絵コンテは承認・merge済み。収録・音声は未着手。</text>
<rect x="24" y="91" width="1230" height="90" rx="5" fill="white" stroke="#cbd5e1"/>
<text x="40" y="117" font-size="16" font-weight="bold">凡例：色は工程種別、破線は未着手の暫定枠、◇は承認・開始条件</text>
<g font-size="14">
<rect x="40" y="140" width="18" height="18" fill="#2563eb"/><text x="66" y="155">青：構成・準備</text>
<rect x="268" y="140" width="18" height="18" fill="#0891b2"/><text x="294" y="155">水色：音声・収録</text>
<rect x="525" y="140" width="18" height="18" fill="#7c3aed"/><text x="551" y="155">紫：編集</text>
<rect x="715" y="140" width="18" height="18" fill="#0f766e"/><text x="741" y="155">緑：確認・記録</text>
<rect x="963" y="140" width="18" height="18" fill="#64748b"/><text x="989" y="155">灰：過去工程</text>
</g>
<text x="24" y="217" font-size="17" font-weight="bold">完了実績（暦日・JST、終日工数ではない）</text>
<g font-size="15"><text x="410" y="248">2026-10-26</text><text x="690" y="248">10-27</text><text x="970" y="248">10-28</text></g>
