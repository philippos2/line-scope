<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
<title id="title">LineScope 残工程の依存関係と概算PR</title>
<desc id="desc">#252 merge後。全体約88%、残り2〜6 PR。総合受入1〜2 PR、安全の不足対応0〜1 PR、計画履歴の不足対応0〜1 PR、運用復旧1〜2 PRを、空白工程なく最大6枠で示す。条件付き枠が不要なら後続を前へ詰める。</desc>
<rect width="1280" height="590" fill="white"/>
<g font-family="sans-serif" fill="#24384b">
<text x="24" y="34" font-size="23" font-weight="bold">残る業務機能と受入：全体約88% ／ 残り2〜6 PR（#252 merge後）</text>
<text x="24" y="63" font-size="15">横軸は最大見積もりのPR工程枠。日程ではない。条件付き枠が不要なら後続を前へ詰める。</text>
