<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">LineScope デモ完成までの最終工程</title>
<desc id="desc">デモ完成基準で約95%。今回の1 PR内で、代表経路確認、CIと記録、片付けと引渡しを順に進める。追加PRは予定しない。</desc>
<rect width="1280" height="420" fill="white"/>
<g font-family="sans-serif" fill="#24384b">
<text x="24" y="35" font-size="23" font-weight="bold">デモ完成まで：約95% ／ 今回の1 PRに最終確認を集約</text>
<text x="24" y="68" font-size="15">横軸はPR内の作業順。日程ではない。一般品質・実用性能の改善は完成後の課題。</text>
<path d="M490 115V330 M720 115V330 M950 115V330 M1180 115V330" stroke="#dae2e9"/>
<text x="605" y="105" text-anchor="middle" font-size="15">工程1</text>
<text x="835" y="105" text-anchor="middle" font-size="15">工程2</text>
<text x="1065" y="105" text-anchor="middle" font-size="15">工程3</text>
<text x="24" y="155" font-size="17" font-weight="bold">代表経路・起動・再現確認</text>
<text x="24" y="180" font-size="13">実接続、正式比較、承認更新、主要UI</text>
<rect x="494" y="133" width="222" height="40" rx="4" fill="#507ca0"/>
<text x="605" y="159" text-anchor="middle" font-size="15" fill="white">実行・結果確認</text>
<text x="24" y="230" font-size="17" font-weight="bold">CI・文書・既知制限</text>
<text x="24" y="255" font-size="13">安全と整合性を維持し、未受入を明示</text>
<rect x="724" y="208" width="222" height="40" rx="4" fill="#8295a5"/>
<text x="835" y="234" text-anchor="middle" font-size="15" fill="white">最新headを確認</text>
<text x="24" y="305" font-size="17" font-weight="bold">片付け・引渡し</text>
<text x="24" y="330" font-size="13">使い捨て環境の削除、PRをreadyへ</text>
<rect x="954" y="283" width="222" height="40" rx="4" fill="#8295a5"/>
<text x="1065" y="309" text-anchor="middle" font-size="15" fill="white">merge可能を報告</text>
<text x="24" y="380" font-size="15" fill="#357354">上記を今回の1 PRで完了する。機能完成のための追加PRは予定しない。</text>
<text x="24" y="410" font-size="14">目的：開発依頼者が一連の業務と仕組みを確認できるデモ・習作。商用SLAは求めない。</text>
</g></svg>
