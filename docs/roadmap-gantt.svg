<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
<title id="title">LineScope 残る業務機能と必要PR数</title>
<desc id="desc">経済・能力・安全の代表経路はmerge済み。残りは安全0〜1、計画と履歴1〜2、インフラ0〜1、品質と全業務受入2〜3、運用復旧1〜2の計4〜9 PR。</desc>
<rect width="1280" height="590" fill="white"/>
<g font-family="sans-serif" fill="#24384b">
<text x="24" y="34" font-size="23" font-weight="bold">残る業務機能と受入：全体約80% ／ 残り4〜9 PR（#249 merge後）</text>
<text x="24" y="63" font-size="15">経済・能力・安全の代表経路はmerge済み。横軸は想定PR工程枠。実日程・PO判断の待ち時間は未見積もり。</text>
