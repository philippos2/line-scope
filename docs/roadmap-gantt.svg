<rect x="24" y="781" width="1230" height="114" rx="5" fill="white" stroke="#cbd5e1"/>
<text x="40" y="811" font-size="18" font-weight="bold">V2 アーキテクチャ・設計思想編（概略企画レビュー待ち・制作未着手）</text>
<text x="40" y="843" font-size="15">◇ 先にV2概略企画をレビュー → V1制作・確認 → 別指示でV2詳細制作。日付・工数未定。</text>
<text x="40" y="872" font-size="15">想定尺6〜8分、案は約7分20秒。コード・記録を静的照合済み。詳細台本／絵コンテは未着手。</text>
<rect x="24" y="917" width="1230" height="82" rx="5" fill="white" stroke="#cbd5e1"/>
<text x="40" y="946" font-size="16" font-weight="bold">任意・未採用 O-F2-WRITE：承認付き供給状態変更</text>
<text x="40" y="978" font-size="15">◇ 採否・時期・工数未定。動画2本の予定とは別。製品機能の追加予定にしない。</text>
<text x="24" y="1040" font-size="15">制作PR数は保存・公開方法の決定後。正式デモ5173／API8002の製品・DB・UIは変更しない。</text>
