<title id="title">採用計画：A1→A2→Bの3 PR</title>
<desc id="desc">計画文書266を先にmergeし、A1で共通状態と基本UI、A2で参照ドロワー、Bで入力と変更手続きを完成させる。各PRで確認とmergeを挟む。本体5〜7.5日、分割手間0.25〜0.5日、待ち時間別。A1：#267 merge済み。A2：#268 merge済み。B：実装・検証済み、利用者確認待ち。</desc>
