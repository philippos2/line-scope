<path d="M1170 112V436" stroke="#dae2e9"/>
<text x="24" y="145" font-size="17" font-weight="bold">回答品質・全BS／Golden受入</text>
<text x="24" y="169" font-size="13">正式入力の統合・未知／拒否・一般LLM／検索</text>
<text x="388" y="145" font-size="14" fill="#507ca0">作業中</text>
