<text x="30" y="1955" font-size="18" font-weight="bold">完了：#267〜#274、#275 F1・Q1。完了工程は残PR数・工数へ加算しない。</text>
<text x="30" y="1990" font-size="17">残PRはH → F2 → F3の3本。設計専用の4本目は作らない。分割が必要なら事前に計画変更を報告。</text>
