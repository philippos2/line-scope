<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1174" viewBox="0 0 1280 1174" role="img" aria-labelledby="title desc">
<title id="title">LineScope 動画第1弾の制作・掲載実績と第2弾の残工程</title>
<desc id="desc">2026年10月26日と27日の暦日に実績バーを配置するガントチャート。アプリと文書は完了。第1弾は制作・掲載済み。詳細シナリオはPR285で承認・merge済み。現在は第2弾の絵コンテをレビューする。音声・図版・編集、確認・圧縮・掲載は絵コンテ確認後の後続。未確定の期間バーは作らない。</desc>
<rect width="1280" height="1174" fill="#f8fafc" />
<g font-family="sans-serif" fill="#183247">
<text x="24" y="38" font-size="24" font-weight="bold">現在：第2弾の絵コンテ。詳細シナリオは承認・merge済み</text>
<text x="24" y="69" font-size="16">今回は18場面の絵コンテを作成。音声生成・収録・動画編集は、絵コンテの確認後に進める。</text>
<rect x="24" y="91" width="1230" height="86" rx="5" fill="white" stroke="#cbd5e1" />
<text x="40" y="116" font-size="16" font-weight="bold">凡例：色は工程、状態は各行に併記。◇は承認・開始条件</text>
<g font-size="14">
<rect x="40" y="137" width="18" height="18" fill="#64748b" /><text x="66" y="152">灰：完了実績</text>
<rect x="265" y="137" width="18" height="18" fill="#2563eb" /><text x="291" y="152">青：構成・シナリオ</text>
<rect x="525" y="137" width="18" height="18" fill="#0891b2" /><text x="551" y="152">水色：音声・収録</text>
<rect x="780" y="137" width="18" height="18" fill="#7c3aed" /><text x="806" y="152">紫：編集</text>
<rect x="965" y="137" width="18" height="18" fill="#0f766e" /><text x="991" y="152">緑：確認・掲載</text>
</g>
<text x="24" y="211" font-size="17" font-weight="bold">実績の時間軸（暦日・JST。バーは実施日で、日中の正確な工数ではない）</text>
<g font-size="15"><text x="410" y="244">2026-10-26</text><text x="690" y="244">10-27</text><text x="970" y="244">10-28</text></g>
<g stroke="#cbd5e1"><path d="M400 258V638 M680 258V638 M960 258V638 M1240 258V638" /><path d="M24 309H1240 M24 363H1240 M24 417H1240 M24 471H1240 M24 525H1240 M24 579H1240 M24 633H1240" /></g>
<g font-size="15">
<text x="24" y="292">F2 #278：共通必須電源 完了</text><rect x="400" y="270" width="280" height="28" fill="#64748b" rx="4" />
<text x="24" y="346">正式環境 #279・F3 #280 完了</text><rect x="680" y="324" width="280" height="28" fill="#64748b" rx="4" />
<text x="24" y="400">V2 概略企画 #282：承認・merge済み</text><rect x="680" y="378" width="280" height="28" fill="#64748b" rx="4" />
<text x="24" y="454">V1 音声・収録・編集：制作済み</text><rect x="680" y="432" width="280" height="28" fill="#64748b" rx="4" />
<text x="24" y="508">V1 #283/#284：掲載済み</text><rect x="680" y="486" width="280" height="28" fill="#64748b" rx="4" />
<text x="24" y="562">V2 詳細シナリオ #285：merge済み</text><rect x="680" y="540" width="280" height="28" fill="#64748b" rx="4" />
<text x="24" y="616">V2 絵コンテ：18場面をレビュー待ち</text><rect x="680" y="594" width="280" height="28" fill="#2563eb" rx="4" /></g>
<text x="24" y="670" font-size="15">第1弾v2：約4分50秒・5.91MB。第2弾は企画・詳細シナリオ承認済み。現在は絵コンテのレビュー。</text>
<rect x="24" y="696" width="1230" height="286" rx="5" fill="white" stroke="#cbd5e1" />
<text x="40" y="728" font-size="18" font-weight="bold">第2弾の残工程（開始日・工数は未確定のため、期間バーは置かない）</text>
<g font-size="15">
<rect x="40" y="751" width="6" height="34" fill="#2563eb" /><text x="60" y="773">1　絵コンテのレビュー　◇ 今回ここまで。新しい作業PRで確認</text>
<rect x="40" y="795" width="6" height="34" fill="#2563eb" /><text x="60" y="817">2　音声・図版の制作　◇ 絵コンテ確認後に開始。既存資産を再利用</text>
<rect x="40" y="839" width="6" height="34" fill="#0891b2" /><rect x="46" y="839" width="6" height="34" fill="#7c3aed" /><text x="60" y="861">3　既存映像の引用・字幕・音声合成・編集　◇ 新たなブラウザ操作は不要</text>
<rect x="40" y="883" width="6" height="34" fill="#0f766e" /><text x="60" y="905">4　内容・視認性・聴感・容量の確認 → 修正 → README掲載</text>
<text x="40" y="953">動画単独9MB以下を目標。無料運用。制作物はローカルの別ディレクトリ、動画用リモートrepoは作らない。</text>
</g>
<rect x="24" y="1005" width="1230" height="86" rx="5" fill="white" stroke="#cbd5e1" />
<text x="40" y="1034" font-size="16" font-weight="bold">任意・未採用 O-F2-WRITE：承認付き供給状態変更</text>
<text x="40" y="1066" font-size="15">◇ 採否・時期・工数未定。動画の残タスクとは別。製品機能の追加予定にはしない。</text>
<text x="24" y="1125" font-size="15">絵コンテと後続の制作・掲載は同じ作業PRで進める方針。製品コード・DB・稼働環境は変更しない。</text>
<text x="24" y="1151" font-size="14">第2弾の想定尺6〜8分（案7分20秒）は動画の長さであり、制作工数ではない。</text>
</g></svg>
