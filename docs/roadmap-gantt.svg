<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200" role="img" aria-labelledby="title desc">
<title id="title">LineScope 動画制作の実績と第2弾の残工程</title>
<desc id="desc">2026年10月26日と27日の実績を日付軸に表示。第2弾の完成候補は7分14秒・6.46MB。全編聴感を含む最終レビュー、開発者による公開は未実施。未確定期間のバーは描かない。</desc>
<rect width="1280" height="1200" fill="#f8fafc"/><g font-family="sans-serif" fill="#183247">
<text x="24" y="38" font-size="24" font-weight="bold">現在：第2弾の完成候補を最終レビュー待ち（PR #286・Draft）</text>
<text x="24" y="70" font-size="16">7分14秒・6,464,798 bytes。全編デコード・画面・音量は確認、全編の直接聴取は未実施。</text>
<rect x="24" y="91" width="1230" height="86" rx="5" fill="white" stroke="#cbd5e1"/>
<text x="40" y="116" font-size="16" font-weight="bold">凡例：色は工程、状態は各行に併記。◇は開始・判断条件</text>
