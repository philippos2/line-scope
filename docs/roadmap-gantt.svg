<text x="30" y="1325" font-size="16">承認分73種類に追加回帰19を加え92種類。実モデル13/36成功は修正前の結果。修正後は未評価。</text>
<g transform="translate(0 260)">
<text x="30" y="1092" font-size="22" font-weight="bold">3．依存待ち・期間未確定（時間軸へ未配置）</text>
<text x="30" y="1122" font-size="17">ここには期間の棒を描かない。F2の影響調査後、開始・終了・期間を見積もって時間軸へ配置する。</text>
<text x="45" y="1167" font-size="18" font-weight="bold">H6-R 実評価の不備修正・再評価（同じ#276／追加件数承認済み）</text>
<text x="45" y="1196" font-size="17">H6-R：実モデル13/36成功。原文位置・対象保持・明示属性の独立照合を修正。再評価待ち。H未達、F2・F3未着手。</text>
<text x="45" y="1218" font-size="14">H6-R未解決：最新等を含む保全照会の対象誤分割。受入前に確認／期間未見積もり。</text>
<g transform="translate(0 80)">
<rect x="30" y="1145" width="1600" height="126" fill="white" stroke="#cbd5e1"/>
<text x="45" y="1175" font-size="20" font-weight="bold">F2 M-208の必須電源依存</text>
<text x="45" y="1205" font-size="18">Hのmerge後 → 影響調査・設計承認 → 実装・検証・merge。工数未見積もり／暫定1PR。</text>
<text x="45" y="1245" font-size="18">F3 やること／やらないこと：H・F2 merge後。暫定0.5〜1日／文書1PR。開始日未確定。</text>
<text x="30" y="1315" font-size="21" font-weight="bold">4．採用判断・原因調査・検証待ち（3PRへ無条件には含めない／未配置）</text>
