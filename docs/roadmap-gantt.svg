<text x="30" y="43" font-size="28" font-weight="bold">LineScope：残り3PRの時間軸ガント</text>
<text x="30" y="77" font-size="21" font-weight="bold">順序：H ハルシネーション対応 → F2 M-208電源依存 → F3 やること／やらないこと</text>
<text x="30" y="107" font-size="18">#276 H6は未達。Agent245成功・20skip、Frontend76成功。実モデル13/36成功。修正後の実モデル再評価待ち。</text>
