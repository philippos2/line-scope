<title id="title">LineScope 残り3PRの時間軸ガント</title>
<desc id="desc">#275 merge済み。残りはハルシネーション対応H、M-208電源依存F2、範囲一覧F3の3PR。上段は10月21日から26日の報告予定期間、下段は実装承認後の10作業日のH見積もり。H6は新たな承認U0後の追加5作業日を独立した時間軸で表示。未見積もりと判断待ちは時間軸の外に明示し、架空の期間を描かない。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
