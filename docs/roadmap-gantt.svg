<text x="30" y="564" font-size="17">図示と利用可能性判定を両立</text>
<text x="30" y="594" font-size="17">暫定1 PR・日数未確定</text>
<text x="30" y="623" font-size="16">大規模なら分割案を先に提示</text>
<g fill="#e2e8f0" stroke="#64748b" stroke-dasharray="6 4"><rect x="420" y="530" width="255" height="57" rx="6"/><rect x="705" y="530" width="260" height="57" rx="6"/><rect x="995" y="530" width="260" height="57" rx="6"/><rect x="1285" y="530" width="270" height="57" rx="6"/></g>
<g font-size="17" text-anchor="middle"><text x="547" y="565">未着手：F1のmerge後</text><text x="835" y="565">設計・範囲の確認後</text><text x="1125" y="565">電源依存・候補判定を確認</text><text x="1420" y="565">利用者確認後にmerge</text></g>
<text x="420" y="624" font-size="16">DB・状態取得／変更統制・Graph・API・JSON・UIへの影響を先に調査。辺を追加するだけでは完了しない。</text>
<text x="420" y="654" font-size="16">調査結果で工数・PR分割を確定し、時間軸とバーを更新。利用可能性の不明を隠さない。</text>
<path d="M1420 592V677H393V758H416" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="731" font-size="20" font-weight="bold">F3 やること／やらないこと</text>
<text x="30" y="764" font-size="17">最新の到達点で範囲一覧を更新</text>
<text x="30" y="794" font-size="17">文書PR 1本・stash保持中</text>
<g fill="#e2e8f0" stroke="#64748b" stroke-dasharray="6 4"><rect x="420" y="730" width="255" height="57" rx="6"/><rect x="705" y="730" width="260" height="57" rx="6"/><rect x="995" y="730" width="260" height="57" rx="6"/><rect x="1285" y="730" width="270" height="57" rx="6"/></g>
<g font-size="17" text-anchor="middle"><text x="547" y="765">F1・F2のmerge完了待ち</text><text x="835" y="765">stashを最新内容へ更新</text><text x="1125" y="765">要件・実装・未確認と照合</text><text x="1420" y="765">文書PRを作成・レビュー</text></g>
<text x="420" y="824" font-size="16">requirements.mdの範囲整理案を保留中。今は取り出さず、2件の改修とmergeが終わってから実施する。</text>
<text x="420" y="854" font-size="16">stashはhashで再確認して保護。古い案のまま適用せず、最新の「やること／やらないこと」を記載する。</text>
