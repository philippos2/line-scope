<rect x="265" y="137" width="18" height="18" fill="#2563eb"/><text x="291" y="152" font-size="14">青：構成・シナリオ</text>
<rect x="525" y="137" width="18" height="18" fill="#0891b2"/><text x="551" y="152" font-size="14">水色：音声・収録</text>
<rect x="780" y="137" width="18" height="18" fill="#7c3aed"/><text x="806" y="152" font-size="14">紫：編集</text>
<rect x="965" y="137" width="18" height="18" fill="#0f766e"/><text x="991" y="152" font-size="14">緑：確認・掲載</text>
<text x="24" y="211" font-size="17" font-weight="bold">実績の時間軸（暦日・JST。実施日を示し、正確な工数ではない）</text>
