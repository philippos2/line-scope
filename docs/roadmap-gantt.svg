<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1860" viewBox="0 0 1600 1860" role="img" aria-labelledby="title desc">
<title id="title">LineScope：完了工程と残タスクF1〜F3とQ1〜Q4の進行計画</title>
<desc id="desc">#274までmerge済み。残計画はF1名称での質問の対象解決、続いてF2 M-208の必須電源依存に続きF3範囲一覧の文書更新の暫定3 PR。F1は専用経路を撤去し、検索結果の共通ビューを修正・限定確認済み。Q1内部IDは#275内で修正、Q2 Tool送信量・Q3検索不一致は期限付きで追跡、F2は未着手。後続の工数と日付は未確定で、バーは日数でなく実施順を示す。各工程で検証、利用者確認、レビュー、mergeを挟む。その他の未解決・未検証・判断待ちは別枠に残す。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="1110" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#183247">
<text x="30" y="42" font-size="26" font-weight="bold">LineScope：完了工程と残タスクの進行計画</text>
<text x="30" y="76" font-size="18">現在：F1 検索結果の共通ビューを修正・限定確認済み → F2 → F3。Q1は#275内、Q2〜Q4は期限付きで追跡。</text>
<text x="30" y="108" font-size="17">既定はF1→F2→F3の暫定3 PR。Q1〜Q4の追加PR数は未確定。総残PR数を3本と断定しない。</text>
<g font-size="17">
<rect x="30" y="132" width="1540" height="103" rx="8" fill="#ecfdf5" stroke="#0f766e"/>
<text x="48" y="161" font-weight="bold">完了：UI是正と基盤整備（merge済み・残工数に加算しない）</text>
<text x="48" y="191">#267〜#270 画面・入力・変更後導線　｜　#271 状態監査　｜　#272 書込の復帰</text>
<text x="48" y="218">#273 比較・質問と入力不足　｜　#274 読取・接続・文書検索の鮮度</text>
</g>
<text x="30" y="271" font-size="19" font-weight="bold">残作業（各タスクを工程行で表示）</text>
<text x="30" y="299" font-size="16">横軸は実施順。日付・日数は調査後に確定するため、下のバー幅は工数を表さない。</text>
<g stroke="#cbd5e1"><path d="M30 343H1570 M30 493H1570 M30 693H1570 M30 883H1570"/><path d="M405 320V883 M690 320V883 M980 320V883 M1270 320V883 M1570 320V883"/></g>
<g font-size="17" text-anchor="middle">
<text x="546" y="331">原因・影響調査／見積もり</text><text x="835" y="331">実装</text><text x="1125" y="331">検証・ブラウザ確認</text><text x="1420" y="331">レビュー・merge</text>
</g>
<text x="30" y="378" font-size="20" font-weight="bold">F1 名称・質問対象の解決</text>
<text x="30" y="409" font-size="17">名称・コード・本文の対象を照合</text>
<text x="30" y="437" font-size="17">想定1 PR・検索結果ビューを確認済み</text>
<rect x="420" y="370" width="255" height="57" rx="6" fill="#0f766e"/>
<g stroke="none"><rect x="705" y="370" width="260" height="57" rx="6" fill="#0f766e"/><rect x="995" y="370" width="260" height="57" rx="6" fill="#0f766e"/><rect x="1285" y="370" width="270" height="57" rx="6" fill="#1d4ed8"/></g>
<g font-size="17" text-anchor="middle"><text x="547" y="405" fill="white">調査済み</text><text x="835" y="405" fill="white">検索結果ビューを修正済み</text><text x="1125" y="405" fill="white">回帰・限定した実モデル確認</text><text x="1420" y="405" fill="white">現在：レビュー待ち</text></g>
<text x="420" y="463" font-size="16">専用経路は#275内で撤去済み。質問全般の対象優先・表記照合・回答表示を通常Readで確認する。</text>
