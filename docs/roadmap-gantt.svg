<text x="24" y="65" font-size="16">完了：#277（2026-10-26 merge）。現在：F2の静的調査完了・実装承認待ち。</text>
<text x="24" y="94" font-size="15">F2は5〜7作業日の提案。以下は上限7日の計画枠で、実績・暦上の締切ではありません。</text>
