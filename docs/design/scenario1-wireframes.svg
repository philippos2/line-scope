<text x="30" y="38" font-size="26">シナリオ1：画面案（レビュー用・未実装）</text>
<text x="30" y="67" font-size="18">検索前 → 停止設備の影響・損害額・代替提案 → 稼働中の候補設備を調べる</text>
<text x="30" y="105" font-size="22">A  検索前：設備は固定表示しない</text>
<rect x="25" y="123" width="1430" height="540" rx="7" fill="#fff" stroke="#b8c9d4"/>
<rect x="25" y="123" width="1430" height="45" rx="7" fill="#163a4b" stroke="#163a4b"/>
