<text x="310" y="983" font-size="13">代替候補・稼働中</text>
<text x="510" y="972" font-size="13">凡例：破線枠＝代替候補</text>
<text x="295" y="1088" font-size="28" fill="#95651c">200,000 円／時間</text>
<text x="295" y="1115" font-size="15">P-100：120,000 ／ P-200：80,000</text>
<text x="295" y="1138" font-size="13">算定データ：選択中の入力・版・出典</text>
<text x="735" y="1083" font-size="16">第2加工機 M-208 ／ 対象製品 P-100</text>
<rect x="735" y="1095" width="185" height="13" rx="7" fill="#e5bd70" stroke="#b8c9d4"/>
<rect x="735" y="1116" width="245" height="13" rx="7" fill="#5da7a3" stroke="#b8c9d4"/>
<text x="990" y="1106" font-size="13">必要 60</text>
<text x="990" y="1128" font-size="13">空き 80</text>
<text x="735" y="1153" font-size="16">能力面では吸収できる見込み</text>
<text x="735" y="1176" font-size="13">安全・品質：未確認／他製品は別途確認</text>
