<rect x="1185" y="989" width="235" height="35" rx="7" fill="#d7eeed" stroke="#b8c9d4"/>
<text x="1197" y="1012" font-size="14">この設備で対応案を比べる</text>
<text x="295" y="1006" font-size="13">つながりをたどった結果です。実際に止まるとは限りません</text>
<text x="295" y="1213" font-size="12">登録された条件での見積もりです。実際の損害額ではありません。</text>
<text x="50" y="1247" font-size="15">質問する   ｜   対応案を比べる   ｜   出典と経路   ｜   入力を登録・訂正   ｜   変更・承認・実行</text>
