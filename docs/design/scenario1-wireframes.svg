<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1990" viewBox="0 0 1480 1990" role="img" aria-labelledby="title desc"><title id="title">シナリオ1 UIワイヤーフレーム</title><desc id="desc">検索前、M-204を調査した後、M-208へ調査を切り替えた状態の静的画面案。実装済み画面ではない。</desc><rect width="1480" height="1990" fill="#eef3f7"/><g font-family="sans-serif" fill="#21394a">
