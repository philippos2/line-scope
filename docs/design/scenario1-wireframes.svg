<rect x="295" y="222" width="220" height="27" rx="7" fill="#d7eeed" stroke="#b8c9d4"/>
<text x="307" y="241" font-size="14">止まると影響を受ける先</text>
<text x="540" y="241" font-size="14">この設備が依存する先</text>
<rect x="1170" y="183" width="270" height="415" rx="7" fill="#f8fbfd" stroke="#b8c9d4"/>
<text x="1185" y="210" font-size="19">選択した項目</text>
<rect x="280" y="434" width="425" height="164" rx="7" fill="#fff" stroke="#b8c9d4"/>
<text x="295" y="462" font-size="18">推定損害額（円／時間）</text>
<rect x="720" y="434" width="435" height="164" rx="7" fill="#fff" stroke="#b8c9d4"/>
<text x="735" y="462" font-size="18">代替の提案</text>
<text x="55" y="340" font-size="15">設備名またはコードを</text>
<text x="55" y="364" font-size="15">入力して検索します。</text>
<text x="480" y="324" font-size="18">設備を選ぶと関係図が表示されます。</text>
<text x="295" y="503" font-size="16">設備を選ぶと表示されます。</text>
<text x="735" y="503" font-size="16">設備を選ぶと候補を探します。</text>
<text x="1185" y="259" font-size="15">項目を選ぶと情報を表示します。</text>
<text x="295" y="618" font-size="12">登録された条件での見積もりです。実際の損害額ではありません。</text>
<text x="50" y="652" font-size="15">質問する   ｜   対応案を比べる   ｜   出典と経路   ｜   入力を登録・訂正   ｜   変更・承認・実行</text>
