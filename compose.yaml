name: linescope

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  environment: &backend-env
    LINESCOPE_DSN: postgresql://linescope:${LINESCOPE_POSTGRES_PASSWORD:?Generate .env with scripts/create_demo_env.py}@postgres:5432/linescope
    LINESCOPE_USERS: ${LINESCOPE_USERS:?Generate .env with scripts/create_demo_env.py}
  init: true

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: linescope
      POSTGRES_DB: linescope
      POSTGRES_PASSWORD: ${LINESCOPE_POSTGRES_PASSWORD:?Generate .env with scripts/create_demo_env.py}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U linescope -d linescope']
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    <<: *backend
    command: [linescope, migrate]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports:
      - '127.0.0.1:${LINESCOPE_API_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, /workspace/container_health.py]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
