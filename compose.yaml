name: linescope

x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  environment: &backend-env
    LINESCOPE_DSN: postgresql://linescope:${LINESCOPE_POSTGRES_PASSWORD:?Generate .env with scripts/create_demo_env.py}@postgres:5432/linescope
    LINESCOPE_USERS: ${LINESCOPE_USERS:?Generate .env with scripts/create_demo_env.py}
    LINESCOPE_LOG_LEVEL: ${LINESCOPE_LOG_LEVEL:-INFO}
    LINESCOPE_LLM_BASE_URL: ${LINESCOPE_LLM_BASE_URL:-http://host.docker.internal:11434}
    LINESCOPE_LLM_MODEL: ${LINESCOPE_LLM_MODEL:-}
    LINESCOPE_LLM_CONTEXT_TOKENS: ${LINESCOPE_LLM_CONTEXT_TOKENS:-16384}
    LINESCOPE_READ_AGENT_DEADLINE_SECONDS: ${LINESCOPE_READ_AGENT_DEADLINE_SECONDS:-90}
    LINESCOPE_KNOWLEDGE_MOCK_ROOT: ${LINESCOPE_KNOWLEDGE_MOCK_ROOT:-}
    LINESCOPE_DEMO_DECISION_MOCK: ${LINESCOPE_DEMO_DECISION_MOCK:-false}
    LINESCOPE_DEMO_DECISION_SCENARIO: ${LINESCOPE_DEMO_DECISION_SCENARIO:-AUTO}
  init: true
  logging: *logging

services:
  postgres:
    image: postgres:18.6
    logging: *logging
    environment:
      POSTGRES_USER: linescope
      POSTGRES_DB: linescope
      POSTGRES_PASSWORD: ${LINESCOPE_POSTGRES_PASSWORD:?Generate .env with scripts/create_demo_env.py}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U linescope -d linescope']
      interval: 5s
      timeout: 5s
      retries: 12
  neo4j:
    image: neo4j:5.26.31-community
    logging: *logging
    environment:
      NEO4J_AUTH: neo4j/${LINESCOPE_NEO4J_PASSWORD:?Generate or upgrade private .env}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1" >/dev/null']
      interval: 5s
      timeout: 10s
      retries: 30
  migrate:
    <<: *backend
    command: [linescope, migrate-and-provision]
    environment:
      <<: *backend-env
      LINESCOPE_QUERY_PASSWORD: ${LINESCOPE_QUERY_PASSWORD:?Upgrade private .env with scripts/upgrade_demo_env.py}
      LINESCOPE_RUNTIME_PASSWORD: ${LINESCOPE_RUNTIME_PASSWORD:?Upgrade private .env with scripts/upgrade_demo_env.py}
      LINESCOPE_PROJECTION_PASSWORD: ${LINESCOPE_PROJECTION_PASSWORD:?Upgrade private .env with scripts/upgrade_demo_env.py}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    environment:
      <<: *backend-env
      LINESCOPE_DSN: postgresql://linescope_runtime:${LINESCOPE_RUNTIME_PASSWORD:?Generate or upgrade private .env}@postgres:5432/linescope
      LINESCOPE_NEO4J_URI: bolt://neo4j:7687
      LINESCOPE_NEO4J_USER: neo4j
      LINESCOPE_NEO4J_PASSWORD: ${LINESCOPE_NEO4J_PASSWORD:?Generate or upgrade private .env}
      LINESCOPE_READ_DSN: postgresql://linescope_query:${LINESCOPE_QUERY_PASSWORD:?Generate or upgrade private .env}@postgres:5432/linescope
    volumes:
      - knowledge-data:/workspace/knowledge:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:${LINESCOPE_API_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /workspace/container_health.py]
      interval: 5s
      timeout: 5s
      retries: 12

  knowledge-admin:
    <<: *backend
    profiles: [tools]
    command: [linescope, --help]
    environment:
      LINESCOPE_DSN: postgresql://linescope:${LINESCOPE_POSTGRES_PASSWORD:?Generate private .env}@postgres:5432/linescope
      LINESCOPE_KNOWLEDGE_MOCK_ROOT: /workspace/knowledge
    volumes:
      - knowledge-data:/workspace/knowledge
    depends_on:
      migrate:
        condition: service_completed_successfully

  graph-admin:
    <<: *backend
    profiles: [tools]
    command: [linescope, --help]
    environment:
      LINESCOPE_DSN: postgresql://linescope:${LINESCOPE_POSTGRES_PASSWORD:?Generate private .env}@postgres:5432/linescope
      LINESCOPE_LOG_LEVEL: ${LINESCOPE_LOG_LEVEL:-INFO}
      LINESCOPE_NEO4J_URI: bolt://neo4j:7687
      LINESCOPE_NEO4J_USER: neo4j
      LINESCOPE_NEO4J_PASSWORD: ${LINESCOPE_NEO4J_PASSWORD:?Generate or upgrade private .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
  projection:
    <<: *backend
    command: [linescope, project-graph]
    stop_grace_period: 45s
    environment:
      LINESCOPE_DSN: postgresql://linescope_projection:${LINESCOPE_PROJECTION_PASSWORD:?Generate or upgrade private .env}@postgres:5432/linescope
      LINESCOPE_LOG_LEVEL: ${LINESCOPE_LOG_LEVEL:-INFO}
      LINESCOPE_NEO4J_URI: bolt://neo4j:7687
      LINESCOPE_NEO4J_USER: neo4j
      LINESCOPE_NEO4J_PASSWORD: ${LINESCOPE_NEO4J_PASSWORD:?Generate or upgrade private .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
  postgres-data:
  knowledge-data:
