[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linescope"
version = "0.1.0"
description = "LineScope backend foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "psycopg[binary]==3.3.6", "pydantic==2.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "httpx==0.28.1"]

[project.scripts]
linescope = "linescope.cli:main"

[tool.setuptools.package-data]
linescope = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured test PostgreSQL database"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
