# Standalone, disposable PostgreSQL instance; never uses the demo volume.
name: linescope-test
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: linescope_test
      POSTGRES_DB: linescope_test
      POSTGRES_PASSWORD: disposable-test-password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U linescope_test -d linescope_test']
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    init: true
    environment:
      LINESCOPE_TEST_DSN: postgresql://linescope_test:disposable-test-password@postgres:5432/linescope_test
    depends_on:
      postgres:
        condition: service_healthy
