# Disposable PostgreSQL and Neo4j; never use demo volumes or publish ports.
name: linescope-test
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: linescope_test
      POSTGRES_DB: linescope_test
      POSTGRES_PASSWORD: disposable-test-password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U linescope_test -d linescope_test']
      interval: 2s
      timeout: 5s
      retries: 30
  neo4j:
    image: neo4j:5.26.31-community
    environment:
      NEO4J_AUTH: neo4j/disposable-graph-password
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p disposable-graph-password "RETURN 1" >/dev/null']
      interval: 5s
      timeout: 10s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    init: true
    environment:
      LINESCOPE_TEST_DSN: postgresql://linescope_test:disposable-test-password@postgres:5432/linescope_test
      LINESCOPE_TEST_NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
