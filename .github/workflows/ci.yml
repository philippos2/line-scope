name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: linescope_test
          POSTGRES_DB: linescope_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linescope_test -d linescope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LINESCOPE_TEST_DSN: postgresql://linescope_test:disposable-ci-password@localhost:5432/linescope_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install Backend dependencies
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e ./backend
      - name: Lint and format
        run: |
          ruff check backend
          ruff format --check backend
      - name: Test Backend and migrations against PostgreSQL
        run: pytest backend/tests -q
      - name: Verify CLI entry point
        run: linescope --help
