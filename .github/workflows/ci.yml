name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests and migrations (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Backend test container
        run: docker compose -f compose.test.yaml build tests
      - name: Lint and format inside container
        run: |
          docker compose -f compose.test.yaml run --rm --no-deps tests ruff check backend scripts
          docker compose -f compose.test.yaml run --rm --no-deps tests ruff format --check backend scripts
      - name: Test Backend and migrations against disposable PostgreSQL and Neo4j
        run: docker compose -f compose.test.yaml run --rm tests pytest backend/tests -q -p no:cacheprovider --durations=30 --ci-shard "$CI_SHARD/2"
      - name: Clean disposable test containers
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans

  runtime:
    name: Runtime startup and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify runtime startup and packaged migrations
        run: |
          python3 scripts/create_demo_env.py
          docker compose -p linescope-ci-runtime up --build -d --wait --wait-timeout 120 api
          docker compose -p linescope-ci-runtime exec -T api linescope --help
          docker compose -p linescope-ci-runtime run --rm migrate
      - name: Clean disposable runtime containers
        if: always()
        run: |
          if test -f .env; then
            docker compose -p linescope-ci-runtime down --volumes --remove-orphans
            rm -f .env
          fi

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Frontend container
        run: docker build --target development -t linescope-frontend-check frontend
      - name: Lint, typecheck, format, tests and build
        run: docker run --rm linescope-frontend-check npm run check

  verification:
    name: Tests and migrations
    needs: [tests, runtime, frontend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CI_TEST_RESULT: ${{ needs.tests.result }}
      CI_RUNTIME_RESULT: ${{ needs.runtime.result }}
      CI_FRONTEND_RESULT: ${{ needs.frontend.result }}
    steps:
      - name: Require all verification jobs to succeed
        run: |
          test "$CI_TEST_RESULT" = success && test "$CI_RUNTIME_RESULT" = success && test "$CI_FRONTEND_RESULT" = success
